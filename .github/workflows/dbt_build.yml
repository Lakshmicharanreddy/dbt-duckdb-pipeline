name: dbt build & publish
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      
      - name: Install dependencies
        run: uv sync
        
      - name: Create All Possible Data Directories
        run: |
          mkdir -p data/raw
          mkdir -p analytics/data
        
      - name: Download Raw Dataset
        run: uv run python scripts/download_data.py
        
      - name: Run dbt Build
        run: uv run dbt build --profiles-dir ../ci
        working-directory: analytics
        
      - name: Upload Database to GitHub Release
        run: |
          gh release create warehouse --notes "Warehouse - auto-built by dbt" || true
          # Upload from whichever path the file landed in safely
          if [ -f "analytics/data/prod.duckdb" ]; then
            gh release upload warehouse analytics/data/prod.duckdb --clobber
          elif [ -f "data/prod.duckdb" ]; then
            gh release upload warehouse data/prod.duckdb --clobber
          fi
        env:
          GH_TOKEN: ${{ github.token }}
