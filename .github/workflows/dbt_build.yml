name: dbt build & publish
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      
      - name: Install dependencies
        run: uv sync
        
      - name: Download Data
        run: uv run python scripts/download_data.py
        
      - name: Run dbt Build
        run: uv run dbt build --profiles-dir ../ci
        working-directory: analytics
        
      - name: Upload Database to GitHub Release
        run: |
          gh release create warehouse --notes "Warehouse - auto-built by dbt" || true
          gh release upload warehouse analytics/data/prod.duckdb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
